nearest_face:
  ros__parameters:
    # Use the driver's C++ JPEG transport. Pulling 848x530 rgb8 frames through
    # a Python ROS subscriber reduced effective inference to about 5 Hz even
    # though the camera publishes a stable 30 Hz compressed stream.
    image_topic: /camera/color/image_raw/compressed
    input_compressed: true
    detection_topic: /nearest_face/detection
    debug_image_topic: /nearest_face/debug_image
    debug_compressed_topic: /nearest_face/debug_image/compressed
    model_path: ''
    score_threshold: 0.70
    nms_threshold: 0.30
    top_k: 5000
    # YuNet returns a facial-region box. These ratios expand the selected box
    # into a full-head crop before publishing: left/right use face width,
    # top/bottom use face height. The result is always clipped to the image.
    bbox_expand_left_ratio: 0.35
    bbox_expand_right_ratio: 0.35
    bbox_expand_top_ratio: 0.55
    bbox_expand_bottom_ratio: 0.30
    max_processing_rate: 15.0
    # Half-resolution YuNet inference; detections are mapped back to the full
    # 848x530 source before bbox expansion/publication.
    detector_input_width: 424
    publish_debug_image: true
    jpeg_quality: 85

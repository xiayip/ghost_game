<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghost Game // Arm Telemetry</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "urdf-loader": "https://unpkg.com/urdf-loader@0.12.6/src/URDFLoader.js"
      }
    }
  </script>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="eyebrow">Find The Ghost</div>
        <div class="title">Arm Telemetry</div>
      </div>
      <div class="conn" id="conn">
        <span class="dot" id="conn-dot"></span>
        <span id="conn-text">connecting…</span>
      </div>
    </header>

    <div class="status-row">
      <span class="badge" id="phase-badge">phase: --</span>
      <span class="found-count" id="found-count">found <b>0</b>/<b>0</b></span>
    </div>

    <div class="layout" id="arm-layout">
      <div class="grid" id="joint-grid"></div>
      <div class="viewport" id="viewport">
        <div class="eyebrow viewport-label">// Arm Pose</div>
      </div>
    </div>

    <div class="camera-panel locked" id="camera-panel">
      <div class="camera-head">
        <span class="eyebrow">// Camera</span>
        <button class="toggle-btn" id="camera-toggle" aria-expanded="true" title="Collapse/expand camera feed">&#9662;</button>
      </div>
      <div class="camera-body" id="camera-body">
        <img id="camera-feed" class="offline" alt="">
        <div class="camera-offline" id="camera-offline">no signal</div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
